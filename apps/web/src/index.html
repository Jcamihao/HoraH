<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Hora H</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#111111">
  <script>
    // Aplica o tema salvo (ou o do sistema) antes de desenhar a página, para não piscar.
    // Chromium (Chrome, Edge, Android) aceita filtro SVG em backdrop-filter; Safari e Firefox não.
    if (window.chrome || /Chrome\//.test(navigator.userAgent)) document.documentElement.classList.add('refracao');
    try {
      var t = localStorage.getItem('hh_tema');
      if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'escuro' ? '#0a0908' : '#111111');
    } catch (e) {}
  </script>
  <!-- Links de agendamento levam um token na URL: não repassar o endereço para outros sites. -->
  <meta name="referrer" content="same-origin">
  <meta name="description" content="Agenda online para salões, barbearias e estúdios de beleza.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <!-- Refração do vidro (protótipo): mapa de deslocamento que entorta o fundo nas bordas, como o Liquid Glass do iOS.
       Só o Chromium aplica filtro SVG em backdrop-filter; nos outros navegadores vale o vidro fosco de _glass.scss. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="refracao-vidro" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feImage href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%20preserveAspectRatio%3D%27none%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27h%27%20x1%3D%270%27%20x2%3D%271%27%20y1%3D%270%27%20y2%3D%270%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27rgb%28255%2C0%2C0%29%27/%3E%3Cstop%20offset%3D%27.16%27%20stop-color%3D%27rgb%28128%2C0%2C0%29%27/%3E%3Cstop%20offset%3D%27.84%27%20stop-color%3D%27rgb%28128%2C0%2C0%29%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27rgb%280%2C0%2C0%29%27/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%27v%27%20x1%3D%270%27%20x2%3D%270%27%20y1%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27rgb%280%2C255%2C0%29%27/%3E%3Cstop%20offset%3D%27.22%27%20stop-color%3D%27rgb%280%2C128%2C0%29%27/%3E%3Cstop%20offset%3D%27.78%27%20stop-color%3D%27rgb%280%2C128%2C0%29%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27rgb%280%2C0%2C0%29%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27rgb%280%2C0%2C128%29%27/%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23h%29%27%20style%3D%27mix-blend-mode%3Ascreen%27/%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23v%29%27%20style%3D%27mix-blend-mode%3Ascreen%27/%3E%3C/svg%3E" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="mapa" />
      <feDisplacementMap in="SourceGraphic" in2="mapa" scale="0.32" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <app-root></app-root>
  <noscript>O Hora H precisa de JavaScript ligado para funcionar.</noscript>
</body>
</html>
